[package]
name = "peakrunner-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false
description = "Client-only networking and server browsing."
[dependencies]
peakrunner-core = { path = "../core" }
peakrunner-protocol = { path = "../protocol" }
peakrunner-discovery = { path = "../discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
sha2 = "0.10"
