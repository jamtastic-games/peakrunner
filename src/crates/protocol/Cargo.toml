[package]
name = "peakrunner-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false
description = "Shared gameplay messages and bounded datagram codecs."
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peakrunner-core = { path = "../core" }
peakrunner-discovery = { path = "../discovery" }
postcard = { version = "1", features = ["alloc"] }
glam = { version = "0.29", features = ["serde"] }
[dev-dependencies]
# The size probe compares against the previous LZ4 snapshots.
lz4_flex = "0.14"
