[package]
name = "peakrunner-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false
default-run = "peakrunner-launcher"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
ureq = "3"
# The banner (assets/banner.png) is decoded at start.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# Basic/virtual Windows display drivers often expose only OpenGL 1.1.
# Use the game's DX12-capable backend, including Windows software adapters.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu"] }


[[bin]]
name = "peakrunner-launcher"
path = "src/main.rs"

[[bin]]
name = "launcher-release"
path = "src/bin/release.rs"
