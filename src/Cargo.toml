[package]
name = "peakrunner"
version = "0.1.0"
edition = "2021"
description = "PeakRunner — ski and disc combat. Native on macOS and Windows, and WebAssembly."
license = "GPL-3.0-only"
publish = false
rust-version = "1.95"
default-run = "peakrunner"

[workspace]
members = [".", "crates/net", "crates/core", "crates/discovery", "crates/protocol", "crates/server", "crates/directory", "crates/launcher", "crates/script"]

[features]
external-map = ["peakrunner-core/external-map"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = "0.36.2"
glam = { version = "0.29", default-features = false, features = ["std"] }
log = "0.4"
peakrunner-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Instant/SystemTime that also work in the browser (std's panic there).
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
peakrunner-net = { path = "crates/net" }
# The server list's table (Find match).
egui_extras = { version = "0.36.2", default-features = false }
env_logger = "0.11"
# Host keys for servers this client starts (src/host.rs).
getrandom = "0.3"
# The Library's pictures (src/library.rs).
png = "0.18"
# Authored models' textures (src/model.rs).
zune-jpeg = "0.5"
gilrs = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioParam",
    "AudioProcessingEvent",
    "ScriptProcessorNode",
    "BiquadFilterNode",
    "BiquadFilterType",
    "Document",
    "Element",
    "EventTarget",
    "MouseEvent",
    "GainNode",
    "Gamepad",
    "GamepadButton",
    "HtmlCanvasElement",
    "Navigator",
    "OscillatorNode",
    "OscillatorType",
    "Window",
] }

[[bin]]
name = "peakrunner"
path = "src/main.rs"

[dev-dependencies]
peakrunner-server = { path = "crates/server" }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The shared simulation runs bot navigation and map queries; unoptimised it
# makes dev play and the navigation tests an order of magnitude slower.
[profile.dev.package.peakrunner-core]
opt-level = 2
